# netlify.toml — R. Scott Echols CV Chatbot
# robertoscottecholscv.netlify.app
# Architecture: pure static site (public/) + Deno Edge Functions (/api/*)
# NO Vite build, NO npm run build, NO dist/ — site is static HTML in public/
# FastAPI (Cloud Run) is called SERVER-SIDE from edge functions, not proxied here.
#
# Required env vars → Netlify Dashboard → Site Settings → Environment Variables:
#   ANTHROPIC_API_KEY      Claude Opus chat runtime for /api/chat
#   GEMINI_API_KEY         Gemini Embedding 2 for /api/embed and ingest workflows
#   BUSINESS_ACCESS_KEY    Business tier unlock passphrase
#   VECTOR_ENGINE_URL      (optional) Cloud Run retrieval URL, enables live RAG
#                          e.g. https://rse-retrieval-abc123-uc.a.run.app
#   ABACUS_API_KEY         Abacus.AI key for /api/abacus (business tier only)
#   ABACUS_MODEL           (optional) RouteLLM model name, default "route-llm"
#
# Cloud Run (NOT Netlify) — set as secrets on the rse-retrieval service:
#   DATABASE_URL           PostgreSQL + pgvector DSN, needs ?sslmode=require
#   INGEST_SECRET          guards POST /ingest
#
# Key rotation runbook: docs/API_KEY_ROTATION.md  (or run: just keys-map)
#
# NOTE: VITE_API_BASE_URL is NOT needed — /api/* routes are handled by edge functions

[build]
  publish = "public"
  command = ""
  # NOTE: do NOT add an `ignore` command here.
  # Netlify's ignore contract is inverted from intuition:
  #   exit 0      -> "yes, ignore this build"  => deploy is CANCELED
  #   exit 1 (non-zero) -> "do not ignore"     => deploy PROCEEDS
  # A previous `ignore = "exit 0"` (added 2026-03-29, commit 7dfb16b) canceled
  # every production deploy from 2026-03-29 onward. Build-time exclusion of
  # scripts/ and *.py is already handled by .netlifyignore, which is the
  # correct mechanism for that intent.

# ── Edge Functions (Deno — zero cold-start at CDN edge) ───────────────────────
[[edge_functions]]
  path = "/api/chat"
  function = "chat"

[[edge_functions]]
  path = "/api/embed"
  function = "embed"

[[edge_functions]]
  path = "/api/verify-access"
  function = "verify-access"

# Abacus.AI side channel — business tier only. Does NOT serve /api/chat;
# the CV chatbot remains locked to Claude Opus 4.6 per CLAUDE.md.
[[edge_functions]]
  path = "/api/abacus"
  function = "abacus"

# Social content generation for SirScottA2A-STUDIO. Generation only — this
# endpoint never publishes. Claude Opus 4.6, same model lock as /api/chat.
[[edge_functions]]
  path = "/api/social-generate"
  function = "social-generate"

# ── SPA fallback ───────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ───────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com https://cdn.fontshare.com; img-src 'self' data: blob:; connect-src 'self' https://*.netlify.app https://*.run.app; frame-ancestors 'none';"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, X-Access-Key"
    X-Rate-Limit-Policy = "20rpm-public-100rpm-business"
